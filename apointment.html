<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="grad.css">
    
    <title>جدول المواعيد</title>
</head>

<body>
    <div class="container">
        <h1>جدول المواعيد</h1>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>التاريخ</th>
                        <th>الوقت</th>
                        <th>اسم الطالب</th>
                        <th>اسم المشرف</th>
                        <th>الحالة</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="appointmentTableBody">
                    <!-- المواعيد ستُضاف ديناميكيًا هنا -->
                </tbody>
            </table>
        </div>
        <div class="form-container">
            <form id="appointmentForm">
                <h2>طلب موعد جديد</h2>
                <input type="date" id="date" placeholder="التاريخ" required>
                <input type="time" id="time" placeholder="الوقت" required>
                <input type="text" id="studentName" placeholder="اسم الطالب" required>
                <input type="text" id="supervisorName" placeholder="اسم المشرف" required>
                <button type="submit">طلب موعد</button>
            </form>
        </div>
    </div>

    <script src="grad.js"></script>
</body>

</html>
